name: QA 32344 4.2-dev
on:
  push:
    branches: [codex/qa-32344-32367-4-2-20261110]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: matrixorigin/matrixone
          ref: 9dd4d33e2bf3353ac66f62105f9093c8032e6ed2
      - name: Checkout isolated MOTR harness from this test branch
        uses: actions/checkout@v4
        with:
          repository: Ariznawlll/matrixone
          ref: codex/qa-32344-32367-4-2-20261110
          path: _qa
      - name: Build exact 4.2-dev
        run: |
          test "$(git rev-parse HEAD)" = 9dd4d33e2bf3353ac66f62105f9093c8032e6ed2
          docker build --target native -t qa-native-42 -f optools/images/Dockerfile .
          docker run --rm -v "$PWD:/work" -w /work qa-native-42 bash -euc '
            git config --global --add safe.directory /work
            src=/go/src/github.com/matrixorigin/matrixone
            cp -a "$src/thirdparties/install" thirdparties/
            cp "$src/cgo/libmo.so" "$src/cgo/libmo.a" cgo/
            export CGO_ENABLED=1 GOAMD64=v3
            export CGO_CFLAGS="-I/work/cgo -I/work/thirdparties/install/include"
            export CGO_LDFLAGS="-L/work/cgo -lmo -L/work/thirdparties/install/lib -Wl,-rpath,/work/cgo -Wl,-rpath,/work/thirdparties/install/lib"
            export LD_LIBRARY_PATH="/work/cgo:/work/thirdparties/install/lib"
            go build -p 2 -ldflags "-X github.com/matrixorigin/matrixone/pkg/version.CommitID=9dd4d33e2bf3353ac66f62105f9093c8032e6ed2" -o mo-service ./cmd/mo-service
          '
      - name: Start isolated MO and run reproductions
        id: products
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" -q install pymysql
          mkdir -p "$RUNNER_TEMP/qa-42" "$RUNNER_TEMP/qa-cgroup"
          cp -a etc "$RUNNER_TEMP/qa-42/etc"
          docker run -d --name qa-mo-42 --network host -v "$PWD:/work" -v "$RUNNER_TEMP/qa-42:/qa" -v "$RUNNER_TEMP/qa-cgroup:/sys/fs/cgroup:ro" -w /qa -e LD_LIBRARY_PATH=/work/cgo:/work/thirdparties/install/lib --entrypoint /work/mo-service qa-native-42 -launch etc/launch/launch.toml -debug-http=127.0.0.1:16090
          "$RUNNER_TEMP/qa-venv/bin/python" - <<'PY'
          import time,pymysql
          for _ in range(180):
              try:c=pymysql.connect(host='127.0.0.1',port=6001,user='dump',password=chr(49)*3,autocommit=True,connect_timeout=2);break
              except (OSError,pymysql.MySQLError):time.sleep(2)
          else:raise RuntimeError('MO did not start')
          def q(s):
              with c.cursor() as cur:cur.execute(s);return cur.fetchall() if cur.description else ()
          v=q('select git_version()')[0][0];print('MO version',v,flush=True);assert v=='9dd4d33e2bf3353ac66f62105f9093c8032e6ed2',v
          failures=[]
          try:
              q('create database qa32344');q('use qa32344')
              q("create table t(id int primary key,c_nodflt varchar(64),c_nulltxt varchar(64) default 'null',c_dflt varchar(64) default 'hello')")
              sql="select column_name,column_default,column_default is null,hex(column_default) from information_schema.columns where table_schema=database() and table_name='t' order by ordinal_position"
              before=q(sql)
              for attempt in range(3):
                  q("insert into t values(1,'a','b','c')");q('truncate table t');after=q(sql)
                  print('32344 repetition',attempt+1,'BEFORE',before,'AFTER',after,flush=True)
                  if before!=after:failures.append('32344 metadata changed')
              q('insert into t(id) values(2)');print('32344 defaults',q('select * from t'),flush=True)
          except Exception as e:print('32344 exception',repr(e),flush=True);failures.append('32344 exception')
          c.close();print('FAILURES',failures,flush=True)
          if failures:raise SystemExit(1)
          PY
      - name: Run 32344 MOTR regression on 4.2-dev
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qa-venv/bin/pip" -q install PyYAML
          cd "$GITHUB_WORKSPACE/_qa/.qa-32344/motr"
          "$RUNNER_TEMP/qa-venv/bin/python" - <<'PYCFG'
          import os,yaml
          p=yaml.safe_load(open('config.yml'))
          p['connection'].update(host='127.0.0.1',port=6001,user='dump',password=chr(49)*3)
          p['run']['report_dir']=os.environ['RUNNER_TEMP']+'/motr-report'
          with open(os.environ['RUNNER_TEMP']+'/qa-motr.yml','w') as f:yaml.safe_dump(p,f)
          PYCFG
          PATH="$RUNNER_TEMP/qa-venv/bin:$PATH" ./motr --config "$RUNNER_TEMP/qa-motr.yml" --branch 4.2-dev --repeat 3 14_issue_regression.issue_32344_truncate_default
      - name: Preserve 4.2 product result
        if: always() && steps.products.outcome == 'failure'
        run: exit 1
      - name: Collect diagnostics and stop owned container
        if: always()
        run: |
          if docker inspect qa-mo-42 >/dev/null 2>&1; then docker logs --tail 40 qa-mo-42 || true; docker rm -f qa-mo-42 || true; fi
