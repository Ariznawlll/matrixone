name: QA live legacy CDC admission
on:
  push:
    branches: [codex/qa32298-live-cdc-0c8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact official main
        uses: actions/checkout@v4
        with:
          repository: matrixorigin/matrixone
          ref: 00da05219fb8dce0266de4efa7c4bbfac06491de
          fetch-depth: 1
      - name: Build exact main and native dependencies
        run: |
          echo "MO_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MatrixOne SHA $(git rev-parse HEAD)"
          docker build --target native -t qa-upgrade-native -f optools/images/Dockerfile .
          docker run --rm -e MO_SHA="$(git rev-parse HEAD)" -v "$PWD:/work" -w /work qa-upgrade-native bash -euc '
            git config --global --add safe.directory /work
            src=/go/src/github.com/matrixorigin/matrixone
            cp -a "$src/thirdparties/install" thirdparties/
            cp "$src/cgo/libmo.so" "$src/cgo/libmo.a" cgo/
            export CGO_ENABLED=1 GOEXPERIMENT=simd GOAMD64=v3
            export CGO_CFLAGS="-I/work/cgo -I/work/thirdparties/install/include"
            export CGO_LDFLAGS="-L/work/cgo -lmo -L/work/thirdparties/install/lib -Wl,-rpath,/work/cgo -Wl,-rpath,/work/thirdparties/install/lib"
            export LD_LIBRARY_PATH="/work/cgo:/work/thirdparties/install/lib"
            go build -p 2 -ldflags "-X github.com/matrixorigin/matrixone/pkg/version.CommitID=$MO_SHA" -o mo-service ./cmd/mo-service
          '
      - name: Prepare official release and isolated data root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-up/root" "$RUNNER_TEMP/qa-up/download" "$RUNNER_TEMP/qa-up/root/new/lib" "$RUNNER_TEMP/qa-up/empty-cgroup"
          curl --retry 8 --retry-all-errors --retry-delay 5 -fLsS -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/matrixorigin/matrixone/releases/assets/594879750?qa=20261109' -o "$RUNNER_TEMP/qa-up/release.zip"
          sha256sum "$RUNNER_TEMP/qa-up/release.zip"
          unzip -q "$RUNNER_TEMP/qa-up/release.zip" -d "$RUNNER_TEMP/qa-up/download"
          mv "$RUNNER_TEMP/qa-up/download/mo-v4.2.5-linux-x86_64" "$RUNNER_TEMP/qa-up/root/old"
          cp -a "$RUNNER_TEMP/qa-up/root/old/etc" "$RUNNER_TEMP/qa-up/root/etc"
          cp mo-service "$RUNNER_TEMP/qa-up/root/new/mo-service"
          cp -a thirdparties/install/lib/*.so cgo/libmo.so "$RUNNER_TEMP/qa-up/root/new/lib/"
          python3 -m venv "$RUNNER_TEMP/qa-up/venv"
          "$RUNNER_TEMP/qa-up/venv/bin/pip" -q install pymysql
      - name: Create real CDC task on 4.2.5
        run: |
          set -euo pipefail
          docker run -d --name qa-up-old --network host -v "$RUNNER_TEMP/qa-up/root:/work" -v "$RUNNER_TEMP/qa-up/empty-cgroup:/sys/fs/cgroup:ro" -w /work -e LD_LIBRARY_PATH=/work/old/lib --entrypoint /work/old/mo-service qa-upgrade-native -launch etc/launch/launch.toml -debug-http=127.0.0.1:16090
          "$RUNNER_TEMP/qa-up/venv/bin/python" - <<'PYSCRIPT'
          import pymysql,time
          def conn(user): return pymysql.connect(host='127.0.0.1',port=6001,user=user,password='111',autocommit=True,connect_timeout=2,read_timeout=60,write_timeout=60)
          for _ in range(180):
              try:c=conn('dump');break
              except (OSError,pymysql.MySQLError):time.sleep(2)
          else:raise RuntimeError('4.2 did not become ready')
          with c.cursor() as q:
              q.execute("create account qa_cdc admin_name 'admin' identified by '111'")
          c.close()
          c=conn('qa_cdc:admin')
          with c.cursor() as q:
              for sql in ["create database qa_cdc_source", "create table qa_cdc_source.t(id int primary key, v varchar(20))", "insert into qa_cdc_source.t values (1,'before')", "create pitr qa_cdc_pitr for database qa_cdc_source range 2 'h'", "create cdc qa_legacy 'mysql://qa_cdc#admin:111@127.0.0.1:6001' 'matrixone' 'mysql://qa_cdc#admin:111@127.0.0.1:6001' 'qa_cdc_source:qa_cdc_target' {'Level'='database'}"]:
                  print('execute fixture step',sql.split()[0:3],flush=True)
                  for attempt in range(120):
                      try:q.execute(sql);break
                      except pymysql.MySQLError as err:
                          if not sql.startswith('create cdc ') or 'TaskService is not available' not in str(err):raise
                          if attempt == 119:raise
                          time.sleep(2)

          c.close()
          c=conn('dump')
          with c.cursor() as q:
              q.execute("select task_name,state from mo_catalog.mo_cdc_task where task_name='qa_legacy'"); rows=q.fetchall();print('real legacy task',rows,flush=True);assert len(rows)==1,rows
          c.close()
          PYSCRIPT
      - name: Verify preflight finds real legacy task
        run: |
          set -euo pipefail
          if ! command -v mysql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client; fi
          cat > "$RUNNER_TEMP/qa-up/client.cnf" <<'CNF'
          [client]
          host=127.0.0.1
          port=6001
          user=dump
          password=111
          CNF
          chmod 600 "$RUNNER_TEMP/qa-up/client.cnf"
          bash optools/upgrade-4.2-preflight.sh "$RUNNER_TEMP/qa-up/decisions.ndjson" --defaults-extra-file="$RUNNER_TEMP/qa-up/client.cnf" 2>&1 | tee "$RUNNER_TEMP/qa-up/preflight.log"
          grep -F 'CDC tasks: 1;' "$RUNNER_TEMP/qa-up/preflight.log"
      - name: Stop old release and assert main rejects task
        run: |
          set -euo pipefail
          docker kill --signal=INT qa-up-old >/dev/null
          test "$(timeout 150 docker wait qa-up-old)" = 0
          docker rm qa-up-old >/dev/null
          sudo cp -a "$RUNNER_TEMP/qa-up/root/mo-data" "$RUNNER_TEMP/qa-up/old-backup"
          docker run -d --name qa-up-main --network host -v "$RUNNER_TEMP/qa-up/root:/work" -v "$RUNNER_TEMP/qa-up/empty-cgroup:/sys/fs/cgroup:ro" -w /work -e LD_LIBRARY_PATH=/work/new/lib --entrypoint /work/new/mo-service qa-upgrade-native -launch etc/launch/launch.toml -debug-http=127.0.0.1:16090
          found=0
          for i in $(seq 1 120); do
            if docker logs qa-up-main 2>&1 | grep -F 'legacy CDC tasks must be exported and removed' >/dev/null; then found=1; break; fi
            sleep 2
          done
          docker logs qa-up-main 2>&1 | grep -F 'legacy CDC tasks must be exported and removed' | head -2 || true
          test "$found" = 1
          echo 'main rejected real legacy CDC task'
      - name: Restore pre-upgrade copy and verify task still present
        run: |
          set -euo pipefail
          docker rm -f qa-up-main >/dev/null
          mv "$RUNNER_TEMP/qa-up/root/mo-data" "$RUNNER_TEMP/qa-up/rejected-main-data"
          sudo cp -a "$RUNNER_TEMP/qa-up/old-backup" "$RUNNER_TEMP/qa-up/root/mo-data"
          docker run -d --name qa-up-old-restored --network host -v "$RUNNER_TEMP/qa-up/root:/work" -v "$RUNNER_TEMP/qa-up/empty-cgroup:/sys/fs/cgroup:ro" -w /work -e LD_LIBRARY_PATH=/work/old/lib --entrypoint /work/old/mo-service qa-upgrade-native -launch etc/launch/launch.toml -debug-http=127.0.0.1:16090
          "$RUNNER_TEMP/qa-up/venv/bin/python" - <<'PYVERIFY'
          import pymysql,time
          for _ in range(180):
              try:c=pymysql.connect(host='127.0.0.1',port=6001,user='dump',password='111',autocommit=True,connect_timeout=2);break
              except (OSError,pymysql.MySQLError):time.sleep(2)
          else:raise RuntimeError('restored 4.2 did not become ready')
          with c.cursor() as q:
              q.execute("select task_name from mo_catalog.mo_cdc_task where task_name='qa_legacy'");assert q.fetchall()==(('qa_legacy',),)
          c.close();print('pre-upgrade backup retains legacy CDC task')
          PYVERIFY
      - name: Print logs on failure
        if: failure()
        run: |
          docker logs qa-up-old 2>&1 | tail -100 || true
          docker logs qa-up-main 2>&1 | tail -100 || true
          docker logs qa-up-old-restored 2>&1 | tail -100 || true
