name: QA 32298 32288 upgrade recovery race on official main
on:
  push:
    branches: [codex/qa-upgrade-11d-race]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact official main
        uses: actions/checkout@v4
        with:
          repository: matrixorigin/matrixone
          ref: 11d2e1ef7e1b3ed3a20e6d7f29f912e55118db5b
      - name: Build native dependencies
        run: |
          test "$(git rev-parse HEAD)" = 11d2e1ef7e1b3ed3a20e6d7f29f912e55118db5b
          docker build --target native -t qa-upgrade-race-native -f optools/images/Dockerfile .
      - name: Run upgrade admission, tenant recovery and cancellation contracts under race
        run: |
          docker run --rm -v "$PWD:/work" -w /work qa-upgrade-race-native bash -euc '
            git config --global --add safe.directory /work
            src=/go/src/github.com/matrixorigin/matrixone
            cp -a "$src/thirdparties/install" thirdparties/
            cp "$src/cgo/libmo.so" "$src/cgo/libmo.a" cgo/
            export CGO_ENABLED=1 GOEXPERIMENT=simd GOAMD64=v3
            export CGO_CFLAGS="-I/work/cgo -I/work/thirdparties/install/include"
            export CGO_LDFLAGS="-L/work/cgo -lmo -L/work/thirdparties/install/lib -Wl,-rpath,/work/cgo -Wl,-rpath,/work/thirdparties/install/lib"
            export LD_LIBRARY_PATH="/work/cgo:/work/thirdparties/install/lib"
            pattern="^(TestLegacyCDCAdmissionBeforeUpgradeMutation|TestDoUpgradeResumesTenantEnumerationFromCommittedRanges|TestDoCheckUpgradeRetainsInterruptedTarget|TestUpgradeRecoveryRetainsMultiStepProgress|TestUpgradeRecoveryTransactionFailures|TestUpgradeRecoveryRecheckAfterCompetingCN|TestUpgradeRetryOwnerCancellation|TestDrainUpgradeTenants|TestDrainUpgradeTenantsStopsAfterCancellation|TestUpgradeTenantRetry)$"
            go test -v -race -p 2 -count=3 -run "$pattern" ./pkg/bootstrap
          '
