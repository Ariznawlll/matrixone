name: QA 32219 single-node statement info load
on:
  push:
    branches: [codex/qa32219-load-a860d63]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact official 4.2-dev
        uses: actions/checkout@v4
        with:
          repository: matrixorigin/matrixone
          ref: a860d63a97cdc38eee90cdbea2e5b351f716328c
          fetch-depth: 1
      - name: Compile exact source and native dependencies
        run: |
          test "$(git rev-parse HEAD)" = a860d63a97cdc38eee90cdbea2e5b351f716328c
          docker build --target native -t qa32365-native -f optools/images/Dockerfile .
          docker run --rm -v "$PWD:/work" -w /work qa32365-native bash -euc '
            git config --global --add safe.directory /work
            src=/go/src/github.com/matrixorigin/matrixone
            cp -a "$src/thirdparties/install" thirdparties/
            cp "$src/cgo/libmo.so" "$src/cgo/libmo.a" cgo/
            export CGO_ENABLED=1 GOEXPERIMENT=simd GOAMD64=v3
            export CGO_CFLAGS="-I/work/cgo -I/work/thirdparties/install/include"
            export CGO_LDFLAGS="-L/work/cgo -lmo -L/work/thirdparties/install/lib -Wl,-rpath,/work/cgo -Wl,-rpath,/work/thirdparties/install/lib"
            export LD_LIBRARY_PATH="/work/cgo:/work/thirdparties/install/lib"
            go build -p 2 -ldflags "-X github.com/matrixorigin/matrixone/pkg/version.CommitID=a860d63a97cdc38eee90cdbea2e5b351f716328c" -o mo-service ./cmd/mo-service
          '
      - name: Start isolated MO
        run: |
          docker run -d --name qa32365-mo --network host -v "$PWD:/work" -w /work -e LD_LIBRARY_PATH=/work/cgo:/work/thirdparties/install/lib qa32365-native ./mo-service -launch etc/launch/launch.toml
          python3 -m venv /tmp/qa32365-venv
          /tmp/qa32365-venv/bin/pip -q install pymysql
          /tmp/qa32365-venv/bin/python - <<'PYWAIT'
          import pymysql,time
          for _ in range(180):
              try:
                  c=pymysql.connect(host='127.0.0.1',port=6001,user='dump',password='111',connect_timeout=2)
                  q=c.cursor();q.execute('select git_version()');v=q.fetchone()[0];c.close()
                  assert v=='a860d63a97cdc38eee90cdbea2e5b351f716328c',v
                  print('official 4.2-dev git_version:',v);break
              except (OSError,pymysql.MySQLError):time.sleep(2)
          else:raise RuntimeError('MO startup timed out')
          PYWAIT
      - name: Measure recent statement info under explicit local load
        env:
          MO_HOST: 127.0.0.1
          MO_PORT: '6001'
          MO_USER: dump
          MO_PASSWORD: '111'
        run: |
          cat > /tmp/qa32219.py <<'PYCASE'
          import os,pymysql,time,threading,statistics
          address=dict(host=os.environ['MO_HOST'],port=int(os.environ['MO_PORT']),user=os.environ['MO_USER'],password=os.environ['MO_PASSWORD'],autocommit=True,connect_timeout=5,read_timeout=30)
          def conn():return pymysql.connect(**address)
          admin=conn();stop=threading.Event();worker_errors=[];worker_counts=[0]*4
          sql='select statement_id,request_at,duration,status,aggr_count from system.statement_info where request_at >= date_sub(now(),interval 5 minute) and request_at < now() order by request_at desc,statement_id desc limit 100'
          def sample(n):
           c=conn();times=[];errs=[];nonempty=0
           try:
            with c.cursor() as q:
             for i in range(n):
              start=time.monotonic()
              try:
               q.execute(sql);rows=q.fetchall();d=time.monotonic()-start;times.append(d);nonempty+=bool(rows)
               if any(rows[j][1]<rows[j+1][1] for j in range(len(rows)-1)):raise AssertionError('request_at order wrong')
              except (pymysql.MySQLError,OSError) as e:errs.append((i,type(e).__name__,str(e)[:120]));break
           finally:c.close()
           return times,errs,nonempty
          def summary(name,res):
           ts,errs,nonempty=res
           if ts:
            ordered=sorted(ts);p95=ordered[min(len(ordered)-1,int(.95*len(ordered)))];print(name,'samples',len(ts),'nonempty',nonempty,'p50_ms',round(statistics.median(ts)*1000,2),'p95_ms',round(p95*1000,2),'max_ms',round(max(ts)*1000,2),'errors',len(errs),flush=True)
           else:print(name,'samples 0 errors',repr(errs),flush=True)
           return bool(ts) and not errs
          try:
           with admin.cursor() as q:
            q.execute('select git_version()');v=q.fetchone()[0];print('4.2-dev version',v,flush=True);assert v=='a860d63a97cdc38eee90cdbea2e5b351f716328c'
            q.execute('create database qa32219_perf');q.execute('create table qa32219_perf.t (id int primary key,v int)')
            q.execute('insert into qa32219_perf.t select result,mod(result,1000) from generate_series(1,500000) g')
            for _ in range(100):q.execute('select count(*) from qa32219_perf.t where id<100');q.fetchone()
           deadline=time.monotonic()+70
           while True:
            low=sample(1)
            if low[2]:break
            if time.monotonic()>deadline:raise RuntimeError('statement_info did not receive observations')
            time.sleep(2)
           before=sample(30);print('low load',end=' ');ok=summary('baseline',before)
           def worker(i):
            c=conn()
            try:
             with c.cursor() as q:
              while not stop.is_set():
               q.execute('select sum(v) from qa32219_perf.t where mod(id,7)=%d'%i);q.fetchone();worker_counts[i]+=1
            except Exception as e:worker_errors.append((i,type(e).__name__,str(e)[:120]))
            finally:c.close()
           threads=[threading.Thread(target=worker,args=(i,)) for i in range(4)]
           for t in threads:t.start()
           time.sleep(2)
           try:
            loaded=sample(60);print('concurrent load',end=' ');ok=summary('loaded',loaded) and ok
           finally:
            stop.set()
            for t in threads:t.join(timeout=60)
           print('load worker completed',worker_counts,'worker errors',worker_errors,flush=True)
           if any(t.is_alive() for t in threads):raise RuntimeError('load worker did not stop')
           if not ok or worker_errors or not all(worker_counts):raise RuntimeError('query/load failed; see evidence')
          finally:
           stop.set()
           try:
            with admin.cursor() as q:q.execute('drop database if exists qa32219_perf')
           finally:admin.close()
          PYCASE
          /tmp/qa32365-venv/bin/python /tmp/qa32219.py
      - name: Cleanup isolated container
        if: always()
        run: |
          docker logs --tail 80 qa32365-mo 2>/dev/null || true
          docker rm -f qa32365-mo 2>/dev/null || true
