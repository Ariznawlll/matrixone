name: QA 29945 white-box official main
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ewm-focused-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: matrixorigin/matrixone
          ref: ae40f12a647880a63466de32a9f507c2c72dca0b
          persist-credentials: false
      - name: Build and run focused EWM package tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ae40f12a647880a63466de32a9f507c2c72dca0b
          timeout 300 docker pull matrixorigin/matrixone:ci-builder > /tmp/builder-pull.log 2>&1 || { echo 'CI builder pull failed'; exit 1; }
          docker run --rm -v "$GITHUB_WORKSPACE":/go/src/github.com/matrixorigin/matrixone -w /go/src/github.com/matrixorigin/matrixone matrixorigin/matrixone:ci-builder bash -c '
            set -euo pipefail
            git config --global --add safe.directory "$PWD"
            if ./optools/images/ci-builder-fingerprint.sh > /tmp/want && cmp -s /tmp/want /mo-prebuilt/thirdparties.fingerprint; then cp -a /mo-prebuilt/thirdparties/install thirdparties/install; fi
            make build GOBUILD_OPT=-cover
            export CGO_CFLAGS="-I$PWD/cgo -I$PWD/thirdparties/install/include"
            export CGO_LDFLAGS="-L$PWD/cgo -L$PWD/thirdparties/install/lib"
            export GOEXPERIMENT=simd
            for pkg in ./pkg/sql/parsers/dialect/mysql ./pkg/sql/plan ./pkg/sql/compile ./pkg/sql/colexec/aggexec ./pkg/sql/colexec/window ./pkg/frontend; do
              echo "=== EWM PACKAGE: $pkg ==="
              go test -p 2 -v -count=1 -timeout=10m -run "Ewm|EWM|ewm" "$pkg"
            done
          '
