name: QA 30051 native Linux temporary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/qa30051
            clients/python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK and test dependencies
        run: python -m pip install -e 'clients/python[analytics,test]' 'SQLAlchemy[asyncio]==2.1.6' 'pyarrow==21.0.0' 'PyMySQL==1.2.3'
      - name: Run native Linux validation
        run: bash .github/qa30051/run.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p qa-evidence
          docker inspect qa30051-mo --format 'state={{.State.Status}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' > qa-evidence/container-state.txt 2>/dev/null || true
          docker logs qa30051-mo > qa-evidence/server.log 2>&1 || true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa30051-native-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/
          retention-days: 14
      - name: Stop owned MO container
        if: always()
        run: docker stop qa30051-mo || true
