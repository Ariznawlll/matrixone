name: Tenant Parallel BVT Trial

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  compose-tenant-bvt:
    uses: matrixorigin/CI/.github/workflows/e2e-compose-parallel.yaml@codex/tenant-parallel-bvt
    with:
      tenant_parallel_enabled: true
      ci_ref: codex/tenant-parallel-bvt
    secrets:
      TOKEN_ACTION: ${{ github.token }}

  standalone-tenant-bvt:
    uses: matrixorigin/CI/.github/workflows/e2e-standalone-parallel.yaml@codex/tenant-parallel-bvt
    with:
      tenant_parallel_enabled: true
      ci_ref: codex/tenant-parallel-bvt
    secrets:
      TOKEN_ACTION: ${{ github.token }}
