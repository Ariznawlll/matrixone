name: QA 32298 32297 32288 stopped release upgrade
on:
  push:
    branches: [codex/qa-upgrade-425-e245]
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact official main
        uses: actions/checkout@v4
        with:
          repository: matrixorigin/matrixone
          ref: e2459cc55f4b514893e19732743460bc5f16d552
          fetch-depth: 1
      - name: Build exact main and native dependencies
        run: |
          test "$(git rev-parse HEAD)" = e2459cc55f4b514893e19732743460bc5f16d552
          docker build --target native -t qa-upgrade-native -f optools/images/Dockerfile .
          docker run --rm -v "$PWD:/work" -w /work qa-upgrade-native bash -euc '
            git config --global --add safe.directory /work
            src=/go/src/github.com/matrixorigin/matrixone
            cp -a "$src/thirdparties/install" thirdparties/
            cp "$src/cgo/libmo.so" "$src/cgo/libmo.a" cgo/
            export CGO_ENABLED=1 GOEXPERIMENT=simd GOAMD64=v3
            export CGO_CFLAGS="-I/work/cgo -I/work/thirdparties/install/include"
            export CGO_LDFLAGS="-L/work/cgo -lmo -L/work/thirdparties/install/lib -Wl,-rpath,/work/cgo -Wl,-rpath,/work/thirdparties/install/lib"
            export LD_LIBRARY_PATH="/work/cgo:/work/thirdparties/install/lib"
            go build -p 2 -ldflags "-X github.com/matrixorigin/matrixone/pkg/version.CommitID=e2459cc55f4b514893e19732743460bc5f16d552" -o mo-service ./cmd/mo-service
          '
      - name: Prepare official release and isolated data root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-up/root" "$RUNNER_TEMP/qa-up/download" "$RUNNER_TEMP/qa-up/root/new/lib" "$RUNNER_TEMP/qa-up/empty-cgroup"
          curl -fLsS https://github.com/matrixorigin/matrixone/releases/download/v4.2.5/mo-v4.2.5-linux-x86_64.zip -o "$RUNNER_TEMP/qa-up/release.zip"
          sha256sum "$RUNNER_TEMP/qa-up/release.zip"
          unzip -q "$RUNNER_TEMP/qa-up/release.zip" -d "$RUNNER_TEMP/qa-up/download"
          mv "$RUNNER_TEMP/qa-up/download/mo-v4.2.5-linux-x86_64" "$RUNNER_TEMP/qa-up/root/old"
          cp -a "$RUNNER_TEMP/qa-up/root/old/etc" "$RUNNER_TEMP/qa-up/root/etc"
          cp mo-service "$RUNNER_TEMP/qa-up/root/new/mo-service"
          cp -a thirdparties/install/lib/*.so cgo/libmo.so "$RUNNER_TEMP/qa-up/root/new/lib/"
          python3 -m venv "$RUNNER_TEMP/qa-up/venv"
          "$RUNNER_TEMP/qa-up/venv/bin/pip" -q install pymysql
      - name: Start released 4.2.5 and create durable fixture
        run: |
          set -euo pipefail
          docker run -d --name qa-up-old --network host -v "$RUNNER_TEMP/qa-up/root:/work" -v "$RUNNER_TEMP/qa-up/empty-cgroup:/sys/fs/cgroup:ro" -w /work -e LD_LIBRARY_PATH=/work/old/lib --entrypoint /work/old/mo-service qa-upgrade-native -launch etc/launch/launch.toml -debug-http=127.0.0.1:16090
          "$RUNNER_TEMP/qa-up/venv/bin/python" - <<'PYOLD'
          import json,pymysql,time,os
          def conn(user):
              return pymysql.connect(host='127.0.0.1',port=6001,user=user,password='111',autocommit=True,connect_timeout=2)
          for _ in range(180):
              try:c=conn('dump');break
              except (OSError,pymysql.MySQLError):time.sleep(2)
          else:raise RuntimeError('release did not become ready')
          with c.cursor() as q:
              q.execute('select version(),git_version()');ver=q.fetchone();print('released version',ver)
              assert '4.2.5' in ver[0],ver
              q.execute('create database qa_upgrade_data')
              q.execute('create table qa_upgrade_data.t (id int primary key, d decimal(12,2), s varchar(40), key idx_s(s))')
              q.execute("insert into qa_upgrade_data.t values (1,12.50,'first'),(2,-9.25,'second')")
              q.execute("create account qa_upgrade_a admin_name 'admin' identified by '111'")
              q.execute("create account qa_upgrade_b admin_name 'admin' identified by '111'")
              q.execute('select name,state from mo_debug.trace_features order by name');trace=q.fetchall();print('historical trace feature rows',len(trace))
          c.close()
          for name in ('qa_upgrade_a','qa_upgrade_b'):
              t=conn(name+':admin')
              with t.cursor() as q:
                  q.execute('create database qa_upgrade_tenant')
                  q.execute('create table qa_upgrade_tenant.t(id int primary key,v varchar(30))')
                  q.execute("insert into qa_upgrade_tenant.t values(1,'retained'),(2,'tenant')")
              t.close()
          with open(os.environ['RUNNER_TEMP']+'/qa-up/trace.json','w') as f:json.dump(trace,f)
          print('release fixture created: system and two tenants')
          PYOLD
      - name: Preflight real released catalog
        run: |
          set -euo pipefail
          if ! command -v mysql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client; fi
          cat > "$RUNNER_TEMP/qa-up/client.cnf" <<'CNF'
          [client]
          host=127.0.0.1
          port=6001
          user=dump
          password=111
          CNF
          chmod 600 "$RUNNER_TEMP/qa-up/client.cnf"
          bash optools/upgrade-4.2-preflight.sh "$RUNNER_TEMP/qa-up/decisions.ndjson" --defaults-extra-file="$RUNNER_TEMP/qa-up/client.cnf"
          python3 - <<'PYPRE'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/qa-up/decisions.ndjson'
          rows=[json.loads(line) for line in open(p)]
          print('real release preflight completed, decision rows',len(rows))
          PYPRE
      - name: Stop release cleanly and start main against identical data root
        run: |
          set -euo pipefail
          docker kill --signal=INT qa-up-old >/dev/null
          code=$(timeout 150 docker wait qa-up-old)
          echo "released process exit code=$code"
          test "$code" = 0
          docker rm qa-up-old >/dev/null
          docker run -d --name qa-up-main --network host -v "$RUNNER_TEMP/qa-up/root:/work" -v "$RUNNER_TEMP/qa-up/empty-cgroup:/sys/fs/cgroup:ro" -w /work -e LD_LIBRARY_PATH=/work/new/lib --entrypoint /work/new/mo-service qa-upgrade-native -launch etc/launch/launch.toml -debug-http=127.0.0.1:16090
      - name: Validate main upgrade and restart
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa-up/check.py" <<'PYCHECK'
          import json,pymysql,time,os
          def conn(user):return pymysql.connect(host='127.0.0.1',port=6001,user=user,password='111',autocommit=True,connect_timeout=2)
          for _ in range(180):
              try:c=conn('dump');break
              except (OSError,pymysql.MySQLError):time.sleep(2)
          else:raise RuntimeError('main did not become SQL ready')
          with c.cursor() as q:
              q.execute('select git_version()');v=q.fetchone()[0];print('main version',v);assert v=='e2459cc55f4b514893e19732743460bc5f16d552',v
              q.execute('select id,cast(d as char),s from qa_upgrade_data.t order by id');rows=q.fetchall();assert rows==((1,'12.50','first'),(2,'-9.25','second')),rows
              q.execute('select name,state from mo_debug.trace_features order by name');got=q.fetchall()
              expected=json.load(open(os.environ['RUNNER_TEMP']+'/qa-up/trace.json'));assert [list(x) for x in got]==expected,(got,expected)
              q.execute("select count(*) from information_schema.tables where table_schema='qa_upgrade_data' and table_name='t'");assert q.fetchone()==(1,)
              print('system table data, metadata and historical trace rows retained',len(got))
          c.close()
          for name in ('qa_upgrade_a','qa_upgrade_b'):
              t=conn(name+':admin')
              with t.cursor() as q:
                  q.execute('select id,v from qa_upgrade_tenant.t order by id');rows=q.fetchall();assert rows==((1,'retained'),(2,'tenant')),rows
                  q.execute("select count(*) from information_schema.partitions where table_schema='qa_upgrade_tenant' and table_name='t'");assert q.fetchone()==(1,)
              t.close()
          print('both tenant rows and partitions metadata retained')
          PYCHECK
          "$RUNNER_TEMP/qa-up/venv/bin/python" "$RUNNER_TEMP/qa-up/check.py"
          docker kill --signal=INT qa-up-main >/dev/null
          code=$(timeout 150 docker wait qa-up-main); echo "first main exit code=$code"; test "$code" = 0
          docker start qa-up-main >/dev/null
          "$RUNNER_TEMP/qa-up/venv/bin/python" "$RUNNER_TEMP/qa-up/check.py"
      - name: Collect diagnostics and clean up
        if: always()
        run: |
          for name in qa-up-old qa-up-main; do
            if docker inspect "$name" >/dev/null 2>&1; then docker logs --tail 70 "$name" || true; docker rm -f "$name" || true; fi
          done
